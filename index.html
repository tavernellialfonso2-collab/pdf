<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro de Cuadruplicados PDF</title>
    
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PDF.js para extraer y leer texto del PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <!-- pdf-lib para crear y editar el nuevo PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .drop-zone-active {
            border-color: #3b82f6 !important;
            background-color: #eff6ff !important;
        }
        /* Spinner animation */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin-fast {
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-lg bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-white text-center">
            <div class="flex justify-center mb-3">
                <svg class="w-12 h-12 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Filtro de Cuadruplicados</h1>
            <p class="text-blue-100 text-sm mt-2">Elimina únicamente las hojas "CUADRUPLICADO" de tus documentos.</p>
        </div>

        <div class="p-8">
            <!-- Dropzone -->
            <div id="drop-zone" class="border-2 border-dashed border-slate-300 rounded-2xl p-8 text-center cursor-pointer transition-all hover:bg-slate-50 group">
                <input type="file" id="file-input" class="hidden" accept="application/pdf">
                
                <div class="flex justify-center mb-4 text-slate-400 group-hover:text-blue-500 transition-colors">
                    <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                </div>
                <h3 class="text-lg font-semibold text-slate-700 mb-1">Selecciona o arrastra tu PDF</h3>
                <p class="text-sm text-slate-500">Soporta facturas con original, duplicado y triplicado.</p>
            </div>

            <!-- Status & Loading Indicator -->
            <div id="status-container" class="hidden mt-6 flex flex-col items-center justify-center p-4">
                <svg class="w-8 h-8 text-blue-600 animate-spin-fast mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <p id="status-text" class="text-sm font-medium text-slate-600">Analizando documento...</p>
            </div>

            <!-- Message Box (Error/Success) -->
            <div id="message-box" class="hidden mt-6 p-4 rounded-xl text-sm font-medium text-center"></div>

            <!-- Result Actions -->
            <div id="result-container" class="hidden mt-6">
                <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 mb-4">
                    <div class="flex items-center">
                        <svg class="w-5 h-5 text-emerald-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <p class="text-emerald-700 font-semibold">¡Procesamiento exitoso!</p>
                    </div>
                    <p id="result-details" class="text-emerald-600 text-sm mt-1 ml-7">Se encontraron X páginas originales.</p>
                </div>
                
                <button id="download-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-blue-200 transition-all transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    Descargar PDF Filtrado
                </button>
                
                <button id="reset-btn" class="w-full mt-3 bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 font-medium py-2.5 px-6 rounded-xl transition-colors">
                    Procesar otro documento
                </button>
            </div>
        </div>
    </main>

    <script>
        // Configure PDF.js worker
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // UI Elements
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const statusContainer = document.getElementById('status-container');
        const statusText = document.getElementById('status-text');
        const messageBox = document.getElementById('message-box');
        const resultContainer = document.getElementById('result-container');
        const resultDetails = document.getElementById('result-details');
        const downloadBtn = document.getElementById('download-btn');
        const resetBtn = document.getElementById('reset-btn');

        let generatedPdfBytes = null;
        let originalFileName = "";

        // Drag and drop event listeners
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('drop-zone-active'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('drop-zone-active'), false);
        });

        dropZone.addEventListener('drop', handleDrop, false);
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
        
        resetBtn.addEventListener('click', resetUI);
        
        downloadBtn.addEventListener('click', () => {
            if (generatedPdfBytes) {
                const blob = new Blob([generatedPdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = originalFileName.replace('.pdf', '_SIN_CUADRUPLICADOS.pdf');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        });

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];
            
            if (file.type !== 'application/pdf') {
                showMessage("Por favor, sube un archivo PDF válido.", "error");
                return;
            }

            originalFileName = file.name;
            processPDF(file);
        }

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'bg-blue-50', 'text-blue-700');
            
            if (type === "error") {
                messageBox.classList.add('bg-red-50', 'text-red-700');
            } else {
                messageBox.classList.add('bg-blue-50', 'text-blue-700');
            }
        }

        function hideMessage() {
            messageBox.classList.add('hidden');
        }

        function resetUI() {
            fileInput.value = "";
            generatedPdfBytes = null;
            originalFileName = "";
            dropZone.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            statusContainer.classList.add('hidden');
            hideMessage();
        }

        async function processPDF(file) {
            try {
                // UI Update
                dropZone.classList.add('hidden');
                hideMessage();
                statusContainer.classList.remove('hidden');
                statusText.textContent = "Analizando el contenido del PDF...";

                const arrayBuffer = await file.arrayBuffer();
                
                // 1. Parse with PDF.js to read text
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const pagesToKeep = [];

                for (let i = 1; i <= pdf.numPages; i++) {
                    statusText.textContent = `Analizando página ${i} de ${pdf.numPages}...`;
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    
                    // Combine all text items on the page to a single string
                    const pageText = textContent.items.map(item => item.str).join(' ').toUpperCase();
                    
                    // Conservamos TODAS las páginas EXCEPTO las que digan "CUADRUPLICADO"
                    if (!pageText.includes('CUADRUPLICADO')) {
                        
                        // Keep track of the 0-based index for pdf-lib
                        pagesToKeep.push(i - 1);
                    }
                }

                if (pagesToKeep.length === 0) {
                    statusContainer.classList.add('hidden');
                    dropZone.classList.remove('hidden');
                    showMessage("Todas las páginas son cuadruplicados o hubo un error al leerlas.", "error");
                    return;
                }

                // 2. Manipulate PDF with pdf-lib
                statusText.textContent = "Generando nuevo PDF...";
                
                const { PDFDocument } = window.PDFLib;
                const originalPdfDoc = await PDFDocument.load(arrayBuffer);
                const newPdfDoc = await PDFDocument.create();

                // Copy selected pages
                const copiedPages = await newPdfDoc.copyPages(originalPdfDoc, pagesToKeep);
                copiedPages.forEach(page => newPdfDoc.addPage(page));

                // Save to bytes
                generatedPdfBytes = await newPdfDoc.save();

                // UI Update: Success
                statusContainer.classList.add('hidden');
                resultContainer.classList.remove('hidden');
                
                if (pagesToKeep.length === 1) {
                    resultDetails.textContent = `Se extrajo 1 página con éxito.`;
                } else {
                    resultDetails.textContent = `Se extrajeron ${pagesToKeep.length} páginas con éxito.`;
                }

            } catch (error) {
                console.error("Error processing PDF:", error);
                statusContainer.classList.add('hidden');
                dropZone.classList.remove('hidden');
                showMessage("Ocurrió un error al procesar el archivo. Asegúrate de que no esté encriptado.", "error");
            }
        }
    </script>
</body>
</html>
